# local reproducibility / demo aid (not a production deployment claim)
# marker path: docker compose up --build → play (Fairy-Stockfish); coach = heuristic default
# diagram import / Ollama coach are not the Compose marker path — use host ./run.sh
# only host port 8080 is published; analyser stays on the compose network.
services:
  analyser:
    build:
      context: .
      dockerfile: Dockerfile.analyser
    volumes:
      - ${NNUE_HOST_DIR:-../_local_nnue}:/nnue:ro
    environment:
      PY_ANALYSER_HOST: "0.0.0.0"
      PY_ANALYSER_PORT: "8001"
      LLM_PROVIDER: "${LLM_PROVIDER:-heuristic}"
      FAIRY_STOCKFISH_PATH: /usr/local/bin/stockfish
      FAIRY_STOCKFISH_NNUE_PATH: /nnue/nn-3475407dc199.nnue
      # optional advanced: LLM_PROVIDER=ollama with host Ollama; URL must hit /api/generate
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      EXPLAIN_LOG: "0"
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.go
    volumes:
      - ${NNUE_HOST_DIR:-../_local_nnue}:/nnue:ro
    ports:
      - "8080:8080"
    environment:
      USE_FAIRY_STOCKFISH: "true"
      FAIRY_STOCKFISH_PATH: /usr/local/bin/stockfish
      FAIRY_STOCKFISH_NNUE_PATH: /nnue/nn-3475407dc199.nnue
      PY_ANALYSER_URL: http://analyser:8001
      PY_ANALYSER_TIMEOUT_MS: "${PY_ANALYSER_TIMEOUT_MS:-15000}"
    depends_on:
      - analyser
    restart: unless-stopped
